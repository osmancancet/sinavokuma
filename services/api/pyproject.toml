[project]
name = "sinavokuma-api"
version = "0.1.0"
description = "Yapay Zeka Destekli Sınav Otomasyonu - Core API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "minio>=7.2",
    "aio-pika>=9.5",
    "sinavokuma-shared",
]

[tool.uv.sources]
sinavokuma-shared = { path = "../../packages/shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
