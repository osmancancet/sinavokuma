[project]
name = "sinavokuma-shared"
version = "0.1.0"
description = "Core API ve Inference servisinin paylaştığı veritabanı şeması"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sinavokuma_shared"]
